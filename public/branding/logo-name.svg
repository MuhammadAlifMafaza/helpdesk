<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 100" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600&amp;family=Orbitron:wght@900&amp;display=swap');

      /* ========================================================= */
      /* 1. STATE DEFAULT / LIGHT MODE (TEMA TERANG)               */
      /* ========================================================= */
      .brand-text {
        font-family: 'Orbitron';
        font-weight: 900;
        font-size: 54px;
        fill: #004B87;
        letter-spacing: 3px;
        transition: fill 0.3s ease;
      }

      .tagline-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        font-size: 15px;
        fill: #475569;
        letter-spacing: 2px;
        transition: fill 0.3s ease;
      }

      .separator-line {
        fill: #CBD5E1;
        transition: fill 0.3s ease;
      }

      .icon-h {
        fill: #004B87;
        transition: fill 0.3s ease;
      }

      .icon-d {
        fill: #FFCA08;
      }

      /* Kuning Sunflower tetap cerah di kedua tema */

      /* ========================================================= */
      /* 2. ADAPTIF DARK MODE (Mendukung Class .dark dari Filament)*/
      /* ========================================================= */
      :root .dark .brand-text,
      .dark .brand-text {
        fill: #60A5FA;
      }

      :root .dark .tagline-text,
      .dark .dark .tagline-text {
        fill: #94A3B8;
      }

      :root .dark .separator-line,
      .dark .dark .separator-line {
        fill: #475569;
      }

      :root .dark .icon-h,
      .dark .dark .icon-h {
        fill: #60A5FA;
      }

      /* Antisipasi jika file di-load sebagai image statis oleh browser tanpa engine class JS */
      @media (prefers-color-scheme: dark) {
        .brand-text {
          fill: #60A5FA;
        }

        .tagline-text {
          fill: #94A3B8;
        }

        .separator-line {
          fill: #475569;
        }

        .icon-h {
          fill: #60A5FA;
        }
      }
    </style>
  </defs>

  <g transform="translate(15, 15) scale(0.7)">
    <polygon class="icon-h"
    points="10,4 35,0 35,35 65,35 65,0 90,0 90,100 65,100 65,60 35,60 35,100 10,100 10,85 0,75 0,25 10,15"
      fill="#004B87" />
    <path class="icon-d"
      d="M 80 0 L 130 0 L 160 30 L 160 70 L 130 100 L 80 100 Z M 105 25 L 105 75 L 120 75 L 135 60 L 135 40 L 120 25 Z"
      fill="#FFCA08" fill-rule="evenodd" />
  </g>

  <!-- <g transform="translate(15, 15) scale(0.7)">
